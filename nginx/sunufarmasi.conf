# ═══════════════════════════════════════════════════════════════════════════════
# Nginx - Reverse Proxy SunuFarmasi API
# Placer ce fichier dans : /etc/nginx/sites-available/sunufarmasi
# Puis activer : sudo ln -s /etc/nginx/sites-available/sunufarmasi /etc/nginx/sites-enabled/
# ═══════════════════════════════════════════════════════════════════════════════

# Limiter les requêtes (anti-DDoS basique)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

upstream sunufarmasi_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── Redirection HTTP → HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.sunufarmasi.sn;      # Remplacer par votre domaine ou IP

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sunufarmasi.sn;      # Remplacer par votre domaine ou IP

    # ── SSL (Certbot/Let's Encrypt) ──────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.sunufarmasi.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sunufarmasi.sn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Headers de sécurité ──────────────────────────────────────────────────
    add_header X-Frame-Options          "DENY"              always;
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Referrer-Policy          "strict-origin"     always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Taille des requêtes ──────────────────────────────────────────────────
    client_max_body_size 10M;

    # ── Logs ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/sunufarmasi_access.log;
    error_log  /var/log/nginx/sunufarmasi_error.log;

    # ── Route Auth (limite stricte anti-brute force) ─────────────────────────
    location ~ ^/api/v1/(auth|users/auth)/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://sunufarmasi_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── API principale ───────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass         http://sunufarmasi_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ── Actuator health (monitoring) ─────────────────────────────────────────
    location /actuator/health {
        proxy_pass         http://sunufarmasi_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        # Autoriser seulement localhost et monitoring interne
        allow 127.0.0.1;
        deny all;
    }

    # ── Bloquer tout le reste ────────────────────────────────────────────────
    location / {
        return 404;
    }
}
