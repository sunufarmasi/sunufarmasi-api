spring:
  application:
    name: sunufarmasi-backend

  # Configuration Base de données PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/sunufarmasi-dev
    # url: jdbc:postgresql://localhost:5432/sunufarmasi-develop
    username: postgres
    password: R00t
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Configuration JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
#      ddl-auto: create-drop  # create-drop en dev, validate en prod
      ddl-auto: update  # create-drop en dev, validate en prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Configuration SQL init
  sql:
    init:
      mode: never
#      data-locations: classpath:data.sql
#  @Column(scale#      continue-on-error: false

  # Configuration Email (SMTP) — simulation si MAIL_PASSWORD vide
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: sunufarmasi@gmail.com
    password: "khli sqqj orji obho"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false
    test-connection: false

  # Configuration Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false

# Configuration Serveur
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Configuration JWT
jwt:
  secret: 3F4428472B4B6250655368566D5971337336763979244226452948404D635166
  # IMPORTANT: Changer ce secret en production !
  # Générer avec: openssl rand -base64 64

  access-token-expiration: 3600000      # 1 heure (en millisecondes)
  refresh-token-expiration: 2592000000  # 30 jours (en millisecondes)
  issuer: pharmago-api

# Configuration Application
app:
  name: SunuPharmasi APi
  version: 1.0.0
  description: API Backend pour PharmaGo - Localisateur de pharmacies

  # Configuration OTP
  otp:
    length: 6
    validity-minutes: 5
    resend-cooldown-seconds: 60
    max-attempts: 3

  # Configuration CORS (virgule-séparée pour compatibilité @Value)
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8080,http://localhost:8100, http://10.152.2.151:8080, http://10.235.80.172:8080, http://192.168.1.37:8080"

  # Endpoint d'initialisation : true en dev, false en prod (via APP_INIT_ENABLED dans .env)
  init:
    enabled: true

  # Seed auto pharmacies au démarrage (si la table est vide)
  seed:
    pharmacies: true

# Configuration Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    display-operation-id: true
  show-actuator: false

# Configuration Logging
logging:
  level:
    root: INFO
    sn.pharmago: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/pharmago-api.log
    max-size: 10MB
    max-history: 30

# Configuration Wave Business Checkout
wave:
  api-key: ${WAVE_API_KEY:}
  webhook-secret: ${WAVE_WEBHOOK_SECRET:}
  api-url: https://api.wave.com/v1
  success-url: sunufarmasi://payment/success
  error-url: sunufarmasi://payment/error

# Configuration Management (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true


# Informations Application
info:
  app:
    name: ${app.name}
    version: ${app.version}
    description: ${app.description}

