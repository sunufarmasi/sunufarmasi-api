# ===================================================================
# CONFIGURATION PRODUCTION - RENDER (OPTIMISE MEMOIRE)
# ===================================================================

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Disable Flyway
spring.flyway.enabled=false

# Server
server.port=${PORT:10000}

# Logging - Reduire les logs
logging.level.root=WARN
logging.level.sn.sunufarmasi=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN

# ===================================================================
# OPTIMISATIONS MEMOIRE (IMPORTANT pour plan gratuit 512MB)
# ===================================================================

# Connection pool reduit
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Tomcat optimise
server.tomcat.threads.max=5
server.tomcat.threads.min-spare=1
server.tomcat.max-connections=50
server.tomcat.accept-count=10

# Desactiver les fonctionnalites non utilisees
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Desactiver Spring Boot DevTools en prod
spring.devtools.restart.enabled=false

# Cache - Desactiver si non utilise
spring.cache.type=none