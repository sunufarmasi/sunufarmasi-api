# ===================================================================
# CONFIGURATION PRODUCTION - RENDER
# ===================================================================

# Database config is handled by DatabaseConfig.java
# spring.datasource.url is NOT needed here

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Disable Flyway (use Hibernate auto DDL instead)
spring.flyway.enabled=false

# Server
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.sn.sunufarmasi=INFO
logging.level.org.hibernate.SQL=WARN

# Optimizations for free plan
server.tomcat.threads.max=10